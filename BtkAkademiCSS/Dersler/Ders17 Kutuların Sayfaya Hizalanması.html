<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title> Kutuların Sayfaya Hizalanması </title> 
        <meta name="utf-8">
        <style>
            div {
                border-style: solid;
                border-width: 5px;
            }

            #buyuk {
                width: 300px;
                height: 200px;
                background-color: yellowgreen;
                border-color: brown;
                position: relative;
                left: 50px;
                
            }

            #kucuk {
                width: 150px;
                height: 50px;
                background-color: cyan;
                border-color: blueviolet;
                position: relative;
                top: 30px;
                left: 50px;
            }

            #kutu3 {
                width: 280px;
                height: 150px;
                background-color: red;
                border-color: royalblue;
                position: fixed;
                bottom: 10px;
                right: 10px;
            }

            #kutu4 {
                width: 150px;
                height: 150px;
                background-color: yellow;
                position: absolute;
                bottom: 20px;
                left: 30px;
                
            }

        </style>
    </head>

    <body>
        <div id="buyuk">
            büyük kutu
            <div id="kutu4">
            kutu4
        </div>
        </div>

        <div id="kucuk">
            küçük kutu
        </div>

        <div id="kutu3">
            kutu3
        </div>

    </body>
</html>

<!--
Kutuların Sayfaya Hizalanması
=============================
position:static; Her kutunun varsayılan değeridir. Static değere sahip kutular HTML komutu nereye konulduysa orada bulunur.

position:relative; Kutunun bulunduğu konumuna göre taşınmasını sağlar.

position:fixed; Kutunun sayfa kenarlarına göre konumlanmasını sağlar.

position:absolute; Başka kutu içinde bulunan kutuları kontrol etmek için kullanılır. İçinde bulunduğu kutuya göre üstten, sağdan, alttan ve soldan mesafeler verilerek kutunun konumu ayarlanır.

-->
