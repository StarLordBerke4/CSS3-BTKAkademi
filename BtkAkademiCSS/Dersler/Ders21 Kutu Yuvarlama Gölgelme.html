<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title>Kutu Yuvarlama, Gölgelendirme </title> 
        <meta name="utf-8">
        <style>
            #kutu {
                width: 150px;
                height: 150px;
                border: solid red 5px;
                background-color: yellow;
                border-radius: 25px;
                padding: 10px;
            }

            #kutu2 {
                width: 150px;
                height: 150px;
                border: solid black 5px;
                background-color: rgb(89, 224, 161);
                border-radius: 25px;
                padding: 10px;
                box-shadow: 10px 15px 10px red;
            }
        </style>

    </head>

    <body>
        <div id="kutu">
            Lorem ipsum dolor sit amet consectetur adipisicing elit.
        </div>

        <br>
        <br>

        <div id="kutu2">
            Lorem ipsum dolor sit amet consectetur.
        </div>
    </body>
</html>

<!--
Kutu Köşelerinin Yuvarlatılması
===============================

Kutu kenarlarını yuvarlatmak için "border radius" özelliği kullanılır.

Kutularda Gölge Oluşturma
=========================

Kutuya gölge yapmak için "box shadow" özelliği kullanılır.

box shadow : h shadow, v shadow, blur, color, inset

none: Varsayılan değerdir. Gölge olmaz.
h-shadow: Gölgenin yatay boyutu.
v-shadow: Gölgenin dikey boyutu.
blur: Gölgenin kenarını belirlenen boyutta yumuşatır.
color: Gölge rengi.
inset: Gölgeyi nesnenin iç tarafına yapar.

-->
