<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title>CSS Liste Biçimlendirme </title> 
        <meta name="utf-8">
        <style>
            ul {
                font-size: 18px;
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-weight: bold;
                font-style: italic;

                /*Liste İmlerini Değiştirmek İçin Kullanınlan Özellik*/
                list-style-type: circle;
            }



        </style>
    </head>
            
    <body>
        <h1>Liste Biçimlendirme İşlemleri</h1>
        <h2>Alışveriş Listesi</h2>
        <ul>
            <li>Armut</li>
            <li>Elma</li>
            <li>Muz</li>
            <li>Karpuz</li>
            <li>Ananas</li>
            <li>Mango</li>
        </ul>
    </body>
</html>

<!--
Liste Biçimlendirme İşlemleri:
=============================

list-style-type: Liste imlerini değiştirmek için css içinde kullanılan özelliktir.

•none (madde imi)
•disk (daire)
•circle (Çember)
•square (kare)
•decimal (numara)
•lower alpha (küçük harf , a,b,c)
•lower greek (yunanca küçük)
•lower latin latince (küçük harf, a,b,c)
•lower roman (küçük roma rakamı,i,ii,iii,iv)
•upper alpha (büyük harf, A,B,C)
•upper greek (yunanca büyük harf)
•upper latin latince büyük harf, A,B,C)
•upper roman (büyük roma rakamı, I,II,III,IV)
•url (“resim”) (madde imi yerine resim görüntülenir)

-->
