<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title> Saydamlık ve Renkler </title> 
        <meta name="utf-8">
        <style>
            #kutu {
                width: 300px;
                height: 200px;
                border: 5px coral solid;
                background-color: brown;
            }

            #bayrak {
                position: relative;
                width: 200px;
                height: 150px;
                left: 50px;
                top: -50px;
                opacity: 1;
            }

            #bayrak:hover {
                opacity: 0.5;
            }
            
        </style>
    </head>

    <body>
        <div id="kutu">
            kutu
        </div>
        <img id="bayrak" src="img/bayrak.jpg" alt="">
    </body>
</html>
