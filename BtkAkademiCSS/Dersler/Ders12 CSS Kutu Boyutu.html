<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title>CSS Kutu Boyutu</title> 
        <meta name="utf-8">
        <style>
            * {
                border-style: solid;

            }

            h1 {
                width: 200px;
                height: 200px;
            }

            p {
                width: 300px;
                height: 200px;
            }
        </style>
    </head>

    <body>
        <h1> CSS Kutu Boyutu </h1>
        <h2> CSS Kutu Boyutunu Öğreniyorum </h2>
        <p>Lorem ipsum dolor sit amet.</p>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aut, eaque?</p>
    </body>
</html>

<!--

Kutu Boyutunu Belirleme
=======================

width: Kutu genişliğini belirlememizi sağlar.
Height: Kutu yüksekliğini belirlememizi sağlar.
