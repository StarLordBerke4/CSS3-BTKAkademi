<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title>CSS Menü Oluşturma </title> 
        <meta name="utf-8">
        <style>
            ul {
                list-style-type: none;
        }

            li {
                display: inline;
                border: olivedrab solid 3px;
                width: 90px;
                padding: 10px;
                border-radius: 5px;
                margin: 5px;
                background-color: yellow;
                float: left;
                font-size: 16px;
                font-weight: bolder;
                text-align: center;
        }

            a:link {
                color: orangered;
                text-decoration: none;
            }

            a:visited {
                color: navy;
                text-decoration: underline;
            }

            a:hover {
                color: blueviolet;
                text-decoration: underline;
            }

            a:active {
                color: brown;
                text-decoration: none;
            }

        </style>
    </head>

    <body>
        <ul>
            <li><a href="#">Anasayfa</a></li>
            <li><a href="#">Hakkımda</a></li>
            <li><a href="#">Ürünlerimiz</a></li>
            <li><a href="#">İletişim</a></li>
        </ul>
    </body>
</html>

<!--
Menü Oluşturma ve Biçimlendirme
===============================

• Menüler liste kullanarak oluşturulabilir.
• Menülerin biçimlendirilmesi CSS Kutu Modeli’nde öğrendiğimiz komutlarla yapılır.

-->
