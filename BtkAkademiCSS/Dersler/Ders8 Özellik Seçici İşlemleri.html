<!DOCTYPE html>
<html lang="tr">
    <head> 
        <title>CSS Özellik Seçiciler </title> 
        <meta name="utf-8">
        <style>
            /*Özellik Seçici Uygulaması*/

            input {
                background-color: pink;
            }

            input:focus {
                background-color: powderblue;
            }

            input[type="text"] {
                background-color: yellow;
            }

        </style>
    </head>

    <body>

        <form>
            Ad Soyad:<input type="text"><br>
            Yaş:<input type="number"><br><br>
            <input type="submit"><input type="reset">
        </form>
        
    </body>
</html>
